<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!--
  /agents/ returned 404 while 17 agent bio pages lived underneath it, so anyone
  who trimmed a bio URL back to its parent - crawler or human - hit nothing.

  This is a redirect stub, not a hub page, and deliberately so: the site already
  has TWO competing team pages (/agents.html and /meet-the-agents.html), both
  self-canonical and both submitted in sitemap.xml. A third real page here would
  split the signal three ways instead of two.

  GitHub Pages serves this repo from main at root and supports no server-side
  redirects, so a 301 is not available. meta refresh + rel=canonical is the
  static-host equivalent. scripts/dgp/sitemap_eligibility.py classifies this
  REDIRECT_STUB and keeps it out of sitemap.xml, which is the correct outcome.

  Target is /meet-the-agents.html because that is what the site itself treats as
  the hub: it is the nav destination in index.html and in every agent bio-nav,
  and it links to all 18 agent pages. /agents.html links to 1.

  NOT resolved here: which of the two hubs should be canonical, and the ~1,030
  site-wide internal links pointing at each. The agent-bio breadcrumb still
  points at /agents.html while the nav directly above it points at
  /meet-the-agents.html. That needs an owner decision.
-->
<title>Our Agents | Gadura Real Estate</title>
<link rel="canonical" href="https://gadurarealestate.com/meet-the-agents.html">
<meta http-equiv="refresh" content="0; url=/meet-the-agents.html">
<meta name="description" content="Meet the Gadura Real Estate team serving Queens, Nassau and Suffolk.">
<style>
  body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       margin:0;display:grid;place-items:center;min-height:100vh;background:#f7f8fa;color:#1b2a6b}
  main{text-align:center;padding:24px}
  a{color:#1b2a6b}
</style>
</head>
<body>
<main>
  <h1>Our Agents</h1>
  <p>Taking you to <a href="/meet-the-agents.html">Meet Our Agents</a>.</p>
</main>
<script>location.replace("/meet-the-agents.html");</script>
</body>
</html>
