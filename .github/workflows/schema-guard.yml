name: schema-policy-guard
# LA-3B0J corrective action: the LA-2A guard existed but nothing executed
# it before GitHub Pages deployed a push. This workflow runs the policy
# scan on every push/PR so a violation fails visibly in Actions and
# notifies the repo owner. (Making it a required check that blocks the
# Pages deploy needs branch protection — an owner decision, since the
# IDX auto-sync bot pushes to main.)
on:
  push:
    branches: [main]
    paths: ["**.html", "scripts/**"]
  pull_request:

jobs:
  schema-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Self-serving review markup scan
        run: python3 scripts/check_schema_policy.py
      # Build Property Pages failed 2026-08-22..2026-10-21 because the placeholder
      # denylist gate had no test coverage, so a false positive on two genuinely
      # Active listings went unnoticed for two months. These fixtures lock the
      # feed-aware behaviour in: exemption requires exactly one qualifying active
      # record, and ambiguous/stale/inactive/missing-feed cases still fail closed.
      - name: Denylist gate fixtures (102 cases)
        run: python3 scripts/dgp/test_denylist_feed_aware.py
