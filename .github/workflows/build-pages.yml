name: Build Property Pages

# FALLBACK / MANUAL PATH ONLY -- do not rely on the push trigger below for the
# scheduled feed sync.
#
# sync-listings.yml pushes data/listings.json with the default GITHUB_TOKEN, and
# GitHub never lets that token trigger another workflow. This workflow therefore
# did NOT run for any scheduled sync between 2026-08-22 and 2026-10-15, and a
# live $999,000 listing 404'd for seven weeks as a result.
#
# sync-listings.yml now builds the pages in its own job. This workflow stays for
# workflow_dispatch and for pushes made by a human or a PAT (both of which do
# trigger it), but it is no longer the mechanism the sync depends on.
on:
  push:
    paths:
      - 'data/listings.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate property pages
        run: node scripts/build-property-pages.js

      - name: Add complete social metadata
        run: python3 scripts/bulk_og_injector.py --path homes --apply

      - name: Enforce broker placeholder denylist (DGP guard)
        run: python3 scripts/dgp/test_placeholder_denylist.py

      - name: Commit generated pages
        run: |
          git config user.name "gadura-pages-bot"
          git config user.email "pages-bot@gadurarealestate.com"
          git add homes/ sitemap-listings.xml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(pages): auto-generate property pages"
            git push
          fi
