name: Build Property Pages

on:
  push:
    # branches filter added 2026-10-24. Without it this workflow fires on ANY
    # branch whose push touches data/listings.json -- which includes every
    # feature branch rebased onto main, because the rebase carries main's
    # listing-sync commits along. The bot then commits generated property pages
    # INTO that feature branch.
    #
    # That is not hypothetical: it put a "chore(pages): auto-generate property
    # pages" commit onto the recruiting branch, dragging three homes/ pages and
    # sitemap-listings.xml into a pull request that should only have touched
    # /join/. It was also the sole cause of that PR's merge conflict.
    branches: [main]
    paths:
      - 'data/listings.json'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Generate property pages
        run: node scripts/build-property-pages.js

      - name: Add complete social metadata
        run: python3 scripts/bulk_og_injector.py --path homes --apply

      - name: Enforce broker placeholder denylist (DGP guard)
        run: python3 scripts/dgp/test_placeholder_denylist.py

      - name: Commit generated pages
        run: |
          git config user.name "gadura-pages-bot"
          git config user.email "pages-bot@gadurarealestate.com"
          git add homes/ sitemap-listings.xml
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "chore(pages): auto-generate property pages"
            git push
          fi
