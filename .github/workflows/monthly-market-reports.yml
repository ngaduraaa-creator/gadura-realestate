name: Monthly Market Reports + IndexNow

on:
  # SCHEDULE DISABLED — incident V2-INC-01 / containment V2-INC-02.
  # The previous trigger ran on the 1st and passed the CURRENT month, so each
  # run published a not-yet-finished period as if complete, using generator
  # fallback constants attributed to OneKey MLS. Do not re-enable until a
  # validated data/market-report-inputs.json exists and the schedule targets
  # the PRIOR completed month (e.g. cron '0 9 3 * *' generating last month).
  #   schedule:
  #     - cron: '0 9 1 * *'
  workflow_dispatch:  # Manual only. The generator now fails closed (exit 2)
                      # when inputs are missing/incomplete, when the reporting
                      # month has not ended, or on a future publication date,
                      # so a manual run cannot republish synthetic figures.

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute current month
        id: month
        run: echo "ym=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Generate market reports
        run: python3 scripts/generate_market_report.py --month "${{ steps.month.outputs.ym }}" --apply

      - name: Re-inject AI master schema on new reports
        run: python3 scripts/inject_ai_schema.py --apply

      - name: Re-inject FAQPage schema
        run: python3 scripts/inject_faqpage_schema.py --apply

      - name: Add complete social metadata
        run: python3 scripts/bulk_og_injector.py --path market-reports --apply

      - name: Rebuild sitemap + specialty feeds
        run: |
          python3 scripts/rebuild_sitemap.py
          python3 scripts/build_specialty_feeds.py

      # Gate B: fail-closed generated-output manifest.
      # This repo is published at its ROOT by GitHub Pages, so anything committed
      # becomes a public URL. Staging is therefore an allowlist of proven pipeline
      # outputs, never a sweep of the workspace. ci_stage_manifest.py classifies
      # EVERY changed path and exits 2 unless all of them are market-reports HTML,
      # one of the six feed files, or a tracked *.html inside the schema injectors'
      # own collect_targets() scope. Deletions, workflow self-modification,
      # scripts/, JS/CSS/Markdown and stray untracked files all fail the run.
      - name: Validate generated-output manifest
        id: manifest
        run: |
          set -euo pipefail
          python3 scripts/ci_stage_manifest.py \
            --manifest "$RUNNER_TEMP/stage-manifest.json" \
            > "$RUNNER_TEMP/staged-paths.txt"
          echo "count=$(wc -l < "$RUNNER_TEMP/staged-paths.txt" | tr -d ' ')" >> "$GITHUB_OUTPUT"

      # Manifest retained for audit. Written to RUNNER_TEMP, never inside the
      # repository, so it cannot be committed or published.
      - name: Upload staging manifest (audit artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage-manifest
          path: ${{ runner.temp }}/stage-manifest.json
          retention-days: 90

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ ! -s "$RUNNER_TEMP/staged-paths.txt" ]; then
            echo "No validated generated output to commit"
            exit 0
          fi
          # Stage ONLY paths the manifest validated. No -A, no -u, no bare globs.
          tr '\n' '\0' < "$RUNNER_TEMP/staged-paths.txt" | xargs -0 git add --
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(market-reports): auto-generate ${{ steps.month.outputs.ym }} reports"
          git push

      - name: Wait 90s for Netlify auto-deploy
        run: sleep 90

      - name: Submit to IndexNow (Bing/ChatGPT/Grok/Copilot)
        run: python3 scripts/indexnow_ping.py --all
