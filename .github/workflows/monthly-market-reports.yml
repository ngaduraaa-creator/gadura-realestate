name: Monthly Market Reports + IndexNow

on:
  # SCHEDULE DISABLED — incident V2-INC-01 / containment V2-INC-02.
  # The previous trigger ran on the 1st and passed the CURRENT month, so each
  # run published a not-yet-finished period as if complete, using generator
  # fallback constants attributed to OneKey MLS. Do not re-enable until a
  # validated data/market-report-inputs.json exists and the schedule targets
  # the PRIOR completed month (e.g. cron '0 9 3 * *' generating last month).
  #   schedule:
  #     - cron: '0 9 1 * *'
  workflow_dispatch:  # Manual only. The generator now fails closed (exit 2)
                      # when inputs are missing/incomplete, when the reporting
                      # month has not ended, or on a future publication date,
                      # so a manual run cannot republish synthetic figures.

permissions:
  contents: write

jobs:
  generate-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute current month
        id: month
        run: echo "ym=$(date +%Y-%m)" >> "$GITHUB_OUTPUT"

      - name: Generate market reports
        run: python3 scripts/generate_market_report.py --month "${{ steps.month.outputs.ym }}" --apply

      - name: Re-inject AI master schema on new reports
        run: python3 scripts/inject_ai_schema.py --apply

      - name: Re-inject FAQPage schema
        run: python3 scripts/inject_faqpage_schema.py --apply

      - name: Add complete social metadata
        run: python3 scripts/bulk_og_injector.py --path market-reports --apply

      - name: Rebuild sitemap + specialty feeds
        run: |
          python3 scripts/rebuild_sitemap.py
          python3 scripts/build_specialty_feeds.py

      - name: Commit and push
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "chore(market-reports): auto-generate ${{ steps.month.outputs.ym }} reports"
          git push

      - name: Wait 90s for Netlify auto-deploy
        run: sleep 90

      - name: Submit to IndexNow (Bing/ChatGPT/Grok/Copilot)
        run: python3 scripts/indexnow_ping.py --all
