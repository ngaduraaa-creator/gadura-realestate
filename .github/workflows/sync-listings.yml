name: Sync Listings — IDX Broker API

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force update'
        required: false
        default: 'false'

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run IDX Broker API sync
        run: node scripts/sync-reso.js
        env:
          IDX_BROKER_API_KEY: ${{ secrets.IDX_BROKER_API_KEY }}
          AGENT_ID_NITIN: ${{ secrets.AGENT_ID_NITIN }}
          AGENT_ID_VINOD: ${{ secrets.AGENT_ID_VINOD }}
          AGENT_ID_GAURAV: ${{ secrets.AGENT_ID_GAURAV }}

      # Why the build runs HERE and not in build-pages.yml.
      #
      # build-pages.yml triggers on pushes touching data/listings.json. This job
      # pushes that file using the default GITHUB_TOKEN, and GitHub deliberately
      # never lets that token trigger another workflow -- a loop guard working
      # as designed. So the build has never run from a scheduled sync.
      #
      # It broke on 2026-08-22 and stayed broken silently, because nothing
      # FAILED: the workflow was simply never invoked. The gap is visible in the
      # run history -- recent successes are manual workflow_dispatch runs.
      # Page freshness has been maintained by regenerating at merge time, by
      # hand. That works until somebody forgets.
      #
      # Building here removes the cross-workflow dependency entirely and runs
      # unconditionally, so it is self-healing: if pages drift from the feed
      # again, the next sync repairs them instead of waiting for a human.
      - name: Build property pages from the synced feed
        run: node scripts/build-property-pages.js

      - name: Add complete social metadata
        run: python3 scripts/bulk_og_injector.py --path homes --apply

      - name: Enforce broker placeholder denylist (DGP guard)
        run: python3 scripts/dgp/test_placeholder_denylist.py

      # Fail loudly and BEFORE the commit step. A run that cannot prove the
      # pages match the feed must not publish them -- GRE-LISTING-TRUTH r3 is
      # the authority on freshness and this preserves it rather than
      # duplicating it.
      - name: Verify listing truth
        run: python3 scripts/check_listing_truth.py

      # One commit for the feed AND the pages built from it. main can then no
      # longer hold a listings.json whose pages were never generated -- the
      # exact state that let an active listing 404 for seven weeks.
      - name: Commit feed and generated pages together
        run: |
          git config user.email "listings-bot@gadurarealestate.com"
          git config user.name "GRE Listings Bot"
          git add data/listings.json homes/ sitemap-listings.xml
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore(listings): auto-sync from IDX Broker API + rebuild pages"
            git push
            echo "feed and generated pages committed and pushed"
          fi
